version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dermascan
      POSTGRES_PASSWORD: dermascan
      POSTGRES_DB: dermascan_ai
    ports:
      - "5432:5432"
    volumes:
      - dermascan_pgdata:/var/lib/postgresql/data

volumes:
  dermascan_pgdata:
